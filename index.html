<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BubaManía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#7A4FD0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BubaManía">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#F3EEFB; --surface:#FFFFFF; --surface2:#EAE2F7; --ink:#2B1745; --muted:#6E5C86;
  --taro:#7A4FD0; --taro-soft:#DCCDF7; --mango:#FFB21E; --pink:#F2507F; --matcha:#2E9E68; --line:#D9CEEB;
  --shadow:0 2px 0 rgba(43,23,69,.12);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#1A1026; --surface:#261838; --surface2:#33224A; --ink:#F3ECFF; --muted:#B7A6D1;
  --taro:#A383F0; --taro-soft:#3E2A5E; --mango:#FFC04D; --pink:#FF6E97; --matcha:#4CC48A; --line:#3E2D57; --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#1A1026; --surface:#261838; --surface2:#33224A; --ink:#F3ECFF; --muted:#B7A6D1;
  --taro:#A383F0; --taro-soft:#3E2A5E; --mango:#FFC04D; --pink:#FF6E97; --matcha:#4CC48A; --line:#3E2D57; --shadow:none;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3,.display{font-family:"Fredoka","DM Sans",system-ui,sans-serif;font-weight:600;letter-spacing:.2px;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--mango);outline-offset:1px}
img{max-width:100%}
.hidden{display:none!important}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px}
.logo .dots{display:flex;gap:3px;align-items:flex-end}
.logo .dots i{display:block;width:9px;height:9px;border-radius:50%;background:var(--ink)}
.logo .dots i:nth-child(2){width:12px;height:12px;background:var(--taro)}
.logo .dots i:nth-child(3){background:var(--pink)}
.logo h1{font-size:24px;font-weight:700}
.sync{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on b{background:var(--matcha)}

main{padding:4px 16px 110px;max-width:900px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1.5px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{background:none;border:0;padding:6px 8px;border-radius:14px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:50px;flex:1;max-width:84px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[hidden]{display:none}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--taro-soft)}
nav.tabs .badge{position:absolute;margin-left:22px;margin-top:-4px;background:var(--pink);color:#fff;font-size:11px;border-radius:10px;padding:0 5px;font-weight:700}

.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:700;background:var(--surface2);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--taro);color:#fff}
.btn.mango{background:var(--mango);color:#2B1745}
.btn.pink{background:var(--pink);color:#fff}
.btn.green{background:var(--matcha);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px}
.section-title h2{font-size:22px}

.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.order{background:var(--surface);border-radius:18px;padding:14px;border:1.5px solid var(--line);box-shadow:var(--shadow);text-align:left;width:100%}
.order h3{font-size:20px}
.pill{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--surface2)}
.pill.abierto{background:var(--taro-soft)}
.pill.cocina{background:var(--mango);color:#2B1745}
.pill.listo{background:var(--matcha);color:#fff}
.pill.pagado{background:var(--surface2);color:var(--muted)}
.amount{font-family:"Fredoka",sans-serif;font-weight:600;font-size:22px}

.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-family:"Fredoka",sans-serif;font-size:22px;color:var(--ink);margin-bottom:6px}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1.5px solid var(--line)}
.sheet-head h2{font-size:22px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{flex:1;overflow:auto;padding:12px 16px}
.sheet-foot{padding:10px 16px;border-top:1.5px solid var(--line);background:var(--surface)}
.iconbtn{background:var(--surface2);border:0;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;flex:none}

.people{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.person{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;display:flex;gap:6px;align-items:center}
.person[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.person small{font-weight:500;opacity:.8}
.cats{display:flex;gap:6px;overflow-x:auto;margin:10px 0 8px}
.cat{flex:none;border:0;background:transparent;padding:6px 12px;border-radius:999px;color:var(--muted);font-weight:700}
.cat[aria-pressed="true"]{background:var(--taro-soft);color:var(--ink)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.prod{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px}
.prod .ph{aspect-ratio:1/1;border-radius:11px;background:var(--surface2);background-size:cover;background-position:center;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-size:26px;color:var(--taro)}
.prod .n{font-size:13.5px;font-weight:700;line-height:1.2}
.prod .p{font-size:13px;color:var(--muted)}
.prod:active{transform:scale(.97)}

.bill{margin-top:14px}
.bill-person{background:var(--surface);border-radius:16px;border:1.5px solid var(--line);padding:10px 12px;margin-bottom:10px}
.bill-person.sel{border-color:var(--taro);border-width:2px}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.line:last-of-type{border-bottom:0}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:28px;height:28px;border-radius:50%;border:0;background:var(--surface2);font-weight:700}
.line .nm{font-weight:600;font-size:14.5px}
.line .nt{font-size:12.5px;color:var(--pink)}
.line .pr{border:0;background:none;font-weight:700;text-decoration:underline dotted;text-underline-offset:3px}
.edited{color:var(--pink)}
.paid-tag{font-size:12.5px;font-weight:700;color:var(--matcha)}

/* Modal */
.modal-wrap{position:fixed;inset:0;z-index:40;background:rgba(26,16,38,.55);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
@media (min-width:640px){.modal-wrap{align-items:center}.modal{border-radius:24px}}
.modal h3{font-size:22px;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--taro);color:#fff;border-color:var(--taro)}

.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.menu-item{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.menu-item:last-child{border-bottom:0}
.thumb{width:56px;height:56px;border-radius:12px;background:var(--surface2);background-size:cover;background-position:center;display:grid;place-items:center;font-family:Fredoka;color:var(--taro);font-size:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px}
.kpi .v{font-family:Fredoka;font-size:26px;font-weight:600}
.kpi .l{font-size:13.5px;color:var(--muted)}
.kitchen{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ktk{background:var(--surface);border-radius:18px;border:2px solid var(--mango);padding:12px}
.ktk li{margin:4px 0}
.ktk ul{padding-left:18px;margin:8px 0}
#qrbox{background:#fff;padding:14px;border-radius:14px;display:inline-block}
.gallery{display:flex;gap:8px;overflow-x:auto}
.gallery img{height:120px;border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:60;font-weight:700;font-size:14px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line);font-size:14.5px}

.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.waiter{font-size:13px;font-weight:700;color:var(--taro)}
.imp{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:start}
.imp:last-child{border-bottom:0}
.imp .t{font-weight:600}
.imp .m{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;margin-right:4px;background:var(--surface2)}
.tag.Alta{background:var(--pink);color:#fff}.tag.Media{background:var(--mango);color:#2B1745}
.tag.hecha{background:var(--matcha);color:#fff}
.chk{display:flex;align-items:center;gap:8px;padding:4px 0}
.chk input{width:auto}
.dcard{background:var(--surface);border:2px solid var(--mango);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.dmap{height:230px;border-radius:14px;border:1.5px solid var(--line);margin-top:6px;overflow:hidden;background:var(--surface2)}
.dres{background:var(--taro-soft);border-radius:12px;padding:10px 12px;margin:4px 0 12px;font-size:15px}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;font-size:14px}
.pin>*{transform:rotate(45deg)}
.rcard{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.rcard.go{border:2px solid var(--matcha)}
.rcard h3{font-size:21px}
.ref{font-size:14.5px;font-weight:600;margin-top:4px}
.kind{font-size:13px;font-weight:700;color:var(--muted)}
.tip{background:var(--surface);border-left:5px solid var(--mango);border-radius:12px;padding:8px 12px;margin:0 0 12px;font-size:14px}
.tip.warn{border-left-color:var(--pink)}
.leaflet-container{font:inherit}
.hlogo{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none}
.llogo{width:110px;height:110px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 4px;border:3px solid var(--surface);box-shadow:0 2px 0 rgba(43,23,69,.15)}
#login h1{text-align:center}
.ptext{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap;margin:6px 0}
/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
#login .box{width:100%;max-width:380px;background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:24px}
#login h1{font-size:34px;margin:6px 0 4px}
body.locked header.top, body.locked nav.tabs, body.locked main{display:none}
body:not(.locked) #login{display:none}
/* Ticket print */
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;background:#fff}
  html,body{background:#fff}
  :root{padding:0}
  @page{margin:2mm}
}
.tk{font-family:"Courier New",ui-monospace,monospace;font-size:12px;line-height:1.3;color:#000}
.tk.w58{width:54mm}.tk.w80{width:74mm}
.tk .c{text-align:center}.tk .b{font-weight:700}
.tk .r{display:flex;justify-content:space-between;gap:6px}
.tk hr{border:0;border-top:1px dashed #000;margin:4px 0}
.tk .big{font-size:15px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
const APP_VERSION = "1.3.0";
/* ---------- Utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN"}).format(Number(n)||0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const hora = ts => new Date(ts).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
const imgSrc = f => f || "";
const DEFAULT_CATS = ["Sodas italianas","Frappés","Ice","Baguettes","Croissants","Alitas","Boneless","Extras"];
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ---------- Supabase ---------- */
const CFG = window.BUBA_CONFIG || {};
const sb = (window.supabase && CFG.url && CFG.anonKey && !CFG.url.includes("TU-PROYECTO")) ? window.supabase.createClient(CFG.url, CFG.anonKey) : null;
const BUCKET = "menu";

const Store = {
  mode:"sync", ready:false, userEmail:"",
  data:{ menu:{}, pedidos:{}, config:{}, mejoras:{}, clientes:{} }, subs:[], queue:{}, channel:null, userName:"",
  on(fn){ this.subs.push(fn); },
  emit(){ this.subs.forEach(f=>f()); },
  async load(){
    const [m,p,c,mj,cl] = await Promise.all([
      sb.from("menu").select("id,data"),
      sb.from("pedidos").select("id,data").order("creado",{ascending:false}).limit(600),
      sb.from("config").select("data").eq("id",1).maybeSingle(),
      sb.from("mejoras").select("id,data"),
      sb.from("clientes").select("id").limit(1)
    ]);
    const err = m.error||p.error||c.error; if (err) throw err;
    this.data.menu = Object.fromEntries(m.data.map(r=>[r.id,r.data]));
    this.data.pedidos = Object.fromEntries(p.data.map(r=>[r.id,r.data]));
    this.data.config = c.data ? c.data.data : {};
    this.data.mejoras = mj.error ? {} : Object.fromEntries(mj.data.map(r=>[r.id,r.data]));
    this.mejorasOk = !mj.error;
    this.clientesOk = !cl.error;
  },
  async init(){
    try { await this.load(); } catch(e){ console.warn(e); setSync(false,"Sin conexión"); toast("No se pudieron cargar los datos"); }
    this.channel = sb.channel("bubamania-live")
      .on("postgres_changes",{event:"*",schema:"public",table:"menu"},x=>this.apply("menu",x))
      .on("postgres_changes",{event:"*",schema:"public",table:"pedidos"},x=>this.apply("pedidos",x))
      .on("postgres_changes",{event:"*",schema:"public",table:"config"},x=>this.apply("config",x))
      .on("postgres_changes",{event:"*",schema:"public",table:"mejoras"},x=>this.apply("mejoras",x))
      .subscribe(status=>{
        if (status==="SUBSCRIBED"){ setSync(true,"En vivo"); this.load().then(()=>this.emit()).catch(()=>{}); }
        else if (status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED") setSync(false,"Reconectando…");
      });
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) this.load().then(()=>this.emit()).catch(()=>{}); });
    this.ready=true; this.emit();
  },
  apply(col, x){
    if (col==="config"){ if (x.new && x.new.data) this.data.config = x.new.data; this.emit(); return; }
    const copy = Object.assign({}, this.data[col]);
    if (x.eventType==="DELETE"){ if (x.old && x.old.id) delete copy[x.old.id]; }
    else if (x.new && x.new.id) copy[x.new.id] = x.new.data;
    this.data[col]=copy; this.emit();
  },
  save(col, id, obj){
    const data = clone(obj);
    if (col==="config") this.data.config=data; else this.data[col] = Object.assign({}, this.data[col], {[id]:data});
    this.emit();
    const row = col==="config" ? {id:1, data} : {id, data};
    const key = col+"/"+(col==="config"?1:id);
    this.queue[key] = (this.queue[key]||Promise.resolve()).then(async()=>{
      const { error } = await sb.from(col).upsert(row); if (error) throw error;
    }).catch(e=>{ console.warn(e); toast("No se pudo guardar. Revisa tu conexión."); });
    return this.queue[key];
  },
  remove(col, id){
    const copy = Object.assign({}, this.data[col]); delete copy[id]; this.data[col]=copy; this.emit();
    const key=col+"/"+id;
    this.queue[key]=(this.queue[key]||Promise.resolve()).then(async()=>{ const {error}=await sb.from(col).delete().eq("id",id); if(error) throw error; }).catch(()=>toast("No se pudo borrar"));
  }
};
function setSync(on, text){ const s=$("#sync"); s.classList.toggle("on", !!on); s.querySelector("span").textContent=text; }

/* ---------- Imágenes ---------- */
function compressImage(file, max=640, q=.78){
  return new Promise((res, rej)=>{
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = ()=>{ const k=Math.min(1, max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error("imagen")),"image/jpeg",q); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("No se pudo leer la imagen")); };
    img.src = url;
  });
}
const blobToDataURL = b => new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); });
async function uploadFile(blob, folder, ext, type){
  const path = `${folder}/${Date.now()}-${uid()}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType:type, cacheControl:"31536000", upsert:false });
  if (error) throw new Error(error.message && /size|large/i.test(error.message) ? "El archivo es demasiado grande" : "No se pudo subir el archivo");
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
async function storeImage(file, max=640){
  const blob = await compressImage(file, max, .8);
  return uploadFile(blob, "fotos", "jpg", "image/jpeg");
}

    if (same) same.cant++; else p.items.push(Object.assign({id:uid(), cant:1, nota:"", editado:false, listo:false}, item));

/* ---------- Cobro ---------- */
function payFlow(o){
  const pend=o.comensales.filter(p=>!p.pago && personTotal(p)>0);
  const env = envioPend(o) ? envioCosto(o) : 0;
  if(!pend.length && !env){ if(orderTotal(o)>0){ mutateOrder(x=>x.estado="pagado"); toast("Pedido cerrado"); if(!isActive(Object.assign({},o,{estado:"pagado"}))) closeOrder(); } else toast("La cuenta está vacía"); return; }
  const opts = pend.map(p=>({ids:[p.id], label:p.nombre, total:personTotal(p)}));
  if (pend.length>1) opts.unshift({ids:pend.map(p=>p.id), label:"Todos juntos", total:pend.reduce((s,p)=>s+personTotal(p),0)});
  if (!pend.length) opts.push({ids:[], label:"Solo envío", total:0});
  let sel=opts.find(x=>x.ids.includes(UI.person) && x.ids.length===1 && pend.length===1)||opts[0];
  const plat = o.origen==="plataforma" || (o.entrega && o.entrega.pago==="plataforma");
  const metodos=["Efectivo","Tarjeta","Transferencia", ...(plat?[`Plataforma${o.plataforma?" ("+o.plataforma+")":""}`]:[])];
  let metodo = plat ? metodos[3] : "Efectivo";
  let inclEnv = env>0 && sel.ids.length===pend.length;
  const pagaCon = o.entrega && Number(o.entrega.pagaCon) || "";
  modal(`<h3>Cobrar</h3>
    <div class="field"><label>¿Quién paga?</label><div class="seg" id="who">${opts.map((x,i)=>`<button data-i="${i}" aria-pressed="${x===sel}">${esc(x.label)}${x.ids.length?" · "+money(x.total):""}</button>`).join("")}</div></div>
    ${env?`<label class="chk" style="margin:-4px 0 10px"><input type="checkbox" id="inclEnv" ${inclEnv?"checked":""}> Incluir envío (${money(env)})</label>`:""}
    <div class="field"><label>Forma de pago</label><div class="seg" id="met">${metodos.map(x=>`<button data-m="${esc(x)}" aria-pressed="${x===metodo}">${esc(x)}</button>`).join("")}</div></div>
    <div class="field" id="cashF"><label for="rec">Recibido</label><input id="rec" type="number" inputmode="decimal" placeholder="0.00" value="${pagaCon}"><p class="muted" id="chg" style="margin:6px 0 0"></p></div>
    <div class="field"><label for="tip">Propina (opcional)</label><input id="tip" type="number" inputmode="decimal" placeholder="0.00"></div>
    <div class="spread" style="margin:8px 0 12px"><span class="muted">A cobrar</span><span class="amount" id="due"></span></div>
    <button class="btn green block" id="payOk">Registrar pago</button>`, m=>{
    const dueNow=()=>sel.total+(inclEnv?env:0)+(parseFloat($("#tip",m).value)||0);
    const upd=()=>{ const due=dueNow(); $("#due",m).textContent=money(due);
      $("#cashF",m).classList.toggle("hidden", metodo!=="Efectivo");
      const r=parseFloat($("#rec",m).value); $("#chg",m).textContent = !isNaN(r) ? (r>=due?`Cambio: ${money(r-due)}`:`Faltan ${money(due-r)}`) : ""; };
    m.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{ sel=opts[+b.dataset.i]; m.querySelectorAll("[data-i]").forEach(x=>x.setAttribute("aria-pressed", x===b)); const ie=$("#inclEnv",m); if(ie){ inclEnv = sel.ids.length===pend.length; ie.checked=inclEnv; } upd(); });
    m.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ metodo=b.dataset.m; m.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed", x===b)); upd(); });
    const ie=$("#inclEnv",m); if(ie) ie.onchange=()=>{ inclEnv=ie.checked; upd(); };
    $("#rec",m).oninput=upd; $("#tip",m).oninput=upd; upd();
    $("#payOk",m).onclick=()=>{
      const tip=parseFloat($("#tip",m).value)||0; const rec=parseFloat($("#rec",m).value);
      if (!sel.ids.length && !inclEnv){ toast("No hay nada que cobrar"); return; }
      if (metodo==="Efectivo" && !isNaN(rec) && rec < dueNow()){ toast("El monto recibido no alcanza"); return; }
      const share = sel.ids.length ? tip/sel.ids.length : 0;
      mutateOrder(x=>{ x.comensales.forEach(p=>{ if(sel.ids.includes(p.id)) p.pago={metodo, mesero:x.mesero||"", monto:personTotal(p), propina:share, recibido: metodo==="Efectivo" && !isNaN(rec) ? rec/sel.ids.length : null, hora:Date.now()}; });
        if (inclEnv && x.entrega) x.entrega.envioPagado={metodo, monto:envioCosto(x), hora:Date.now()};
        if (x.comensales.every(p=>p.pago || personTotal(p)===0) && !envioPend(x)) { x.estado="pagado"; x.cerrado=Date.now(); } });
      closeModal();
      const after=Store.data.pedidos[UI.openOrder];
      toast(after && after.estado==="pagado" ? "Pedido pagado" : "Pago registrado");
      if (confirm("¿Imprimir ticket de este pago?")) printTicket(Store.data.pedidos[UI.openOrder], sel.ids.length===o.comensales.length?null:sel.ids, inclEnv);
      if (after && !isActive(after)) closeOrder();
    };
  });
}

function ticketOptions(o){
  modal(`<h3>Ticket</h3>
    <button class="btn primary block" data-t="all">Cuenta completa</button>
    ${o.comensales.length>1 ? o.comensales.map(p=>`<button class="btn ghost block" style="margin-top:8px" data-t="${p.id}">Solo ${esc(p.nombre)} · ${money(personTotal(p))}</button>`).join(""):""}

    <p class="muted" style="font-size:13.5px">Se abrirá el diálogo de impresión del celular. Elige tu impresora de tickets y papel de ${cfg().papel} mm.</p>`, m=>{
    m.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ closeModal(); printTicket(o, b.dataset.t==="all"?null:[b.dataset.t]); });
    $("#tw",m).onclick=()=>window.open("https://wa.me/?text="+encodeURIComponent(ticketText(o)),"_blank");
  });
}
function printTicket(o, ids, withEnv){
  if(!o) return; const c=cfg(); const e=o.entrega||null;
  const showEnv = o.tipo==="domicilio" && (withEnv===undefined ? !ids : withEnv);
  const envAmt = showEnv ? envioCosto(o) : 0;
  const people = o.comensales.filter(p=>!ids||ids.includes(p.id)).filter(p=>p.items.length);
  const total = people.reduce((s,p)=>s+personTotal(p),0);
  const tips = people.reduce((s,p)=>s+(p.pago&&p.pago.propina||0),0);
  const d=new Date();
  $("#print").innerHTML = `<div class="tk w${c.papel}">
    <div class="c big">${esc(c.negocio)}</div>
    ${c.direccion?`<div class="c">${esc(c.direccion)}</div>`:""}
    <div class="c">${d.toLocaleDateString("es-MX")} ${d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})}</div>
    <div class="c b">Pedido #${o.num} · ${esc(o.nombre)}</div>${o.mesero?`<div class="c">Te atendió: ${esc(o.mesero)}</div>`:""}
    ${kindLine(o)?`<div class="c">${esc(kindLine(o).replace(/[🛵🥡]\s?/g,""))}</div>`:""}<hr>
    ${o.tipo==="domicilio"&&e?`<div class="b">ENTREGA A DOMICILIO</div><div>${esc(e.cliente||o.nombre)}${e.telefono?" · "+esc(e.telefono):""}</div>
      ${e.ubicacion&&!/^https?:/i.test(e.ubicacion)?`<div>${esc(e.ubicacion)}</div>`:""}${e.referencias?`<div>Ref: ${esc(e.referencias)}</div>`:""}
      ${e.repartidor?`<div>Repartidor: ${esc(e.repartidor)}</div>`:""}<hr>`:""}
    ${people.map(p=>`<div class="b">${esc(p.nombre)}</div>
      ${p.items.map(i=>`<div class="r"><span>${i.cant} x ${esc(i.nombre)}</span><span>${money(i.precio*i.cant)}</span></div>${i.nota?`<div>  · ${esc(i.nota)}</div>`:""}`).join("")}
      ${people.length>1?`<div class="r b"><span>Subtotal</span><span>${money(personTotal(p))}</span></div>`:""}
      ${p.pago?`<div>Pago: ${esc(p.pago.metodo)}${p.pago.recibido?` · Recibido ${money(p.pago.recibido)}`:""}</div>`:""}<hr>`).join("")}
    ${tips?`<div class="r"><span>Propina</span><span>${money(tips)}</span></div>`:""}
    ${showEnv?`<div class="r"><span>Envío${e&&e.km?` (${e.km.toFixed(1)} km)`:""}</span><span>${envAmt?money(envAmt):"Gratis"}</span></div>`:""}
    <div class="r big"><span>TOTAL</span><span>${money(total+tips+envAmt)}</span></div>
    ${e&&e.pago==="contraentrega"&&Number(e.pagaCon)&&!people.every(p=>p.pago)?`<div class="r"><span>Paga con</span><span>${money(e.pagaCon)}</span></div><div class="r b"><span>Cambio a llevar</span><span>${money(Math.max(0,Number(e.pagaCon)-(total+envAmt)))}</span></div>`:""}<hr>
    <div class="c">${esc(c.pie)}</div>
    <div class="c" style="font-size:10px;margin-top:4px">Aviso de privacidad: ${esc(avisoUrl().replace(/^https?:\/\//,""))}</div><div class="c">&nbsp;</div></div>`;
  setTimeout(()=>{ try{ window.print(); } catch(e){ toast("La impresión no está disponible aquí. Usa WhatsApp."); } }, 60);
}
function ticketText(o){
  const c=cfg(); let t=`*${c.negocio}*\nPedido #${o.num} · ${o.nombre}\n`;
  o.comensales.filter(p=>p.items.length).forEach(p=>{ t+=`\n*${p.nombre}*\n`; p.items.forEach(i=>{ t+=`${i.cant} x ${i.nombre} — ${money(i.precio*i.cant)}${i.nota?` (${i.nota})`:""}\n`; }); if(o.comensales.length>1) t+=`Subtotal: ${money(personTotal(p))}\n`; });
  if (o.tipo==="domicilio") t+=`\nEnvío: ${envioCosto(o)?money(envioCosto(o)):"gratis"}\n`;
  return t+`\n*TOTAL: ${money(orderTotal(o))}*\n${c.pie}`;
}

    $("#pc",m).onchange=e=>{ if(e.target.value==="__new"){ const n=prompt("Nombre de la nueva categoría"); if(n&&n.trim()){ const cc=cfg(); cc.categorias=[...new Set([...(cc.categorias||[]), n.trim()])]; Store.save("config","main",cc); const o=document.createElement("option"); o.textContent=n.trim(); e.target.insertBefore(o, e.target.lastElementChild); e.target.value=n.trim(); } else e.target.selectedIndex=0; } };

function publicMenuHTML(inline){

function waiterBreakdown(list, pays, propinas, day){
  const c=cfg(); const modo=c.propinaModo||"individual";
  const map={};
  const row=n=>map[n]=map[n]||{name:n, ventas:0, pedidos:0, propias:0};
  list.forEach(o=>{ const n=o.mesero||"Sin asignar"; if(o.estado==="pagado") row(n).pedidos++; });
  pays.forEach(p=>{ const n=p.mesero||"Sin asignar"; row(n).ventas+=p.monto; row(n).propias+=(p.propina||0); });
  const names=Object.keys(map).filter(n=>map[n].ventas>0||map[n].pedidos>0);
  if (!names.length || (names.length===1 && names[0]==="Sin asignar" && !(c.meseros||[]).length)) return {html:"", rows:[], defaultPool:[], modoTxt:""};
  const candidates=[...new Set([...(c.meseros||[]), ...names.filter(n=>n!=="Sin asignar")])];
  const defaultPool=names.filter(n=>n!=="Sin asignar");
  const pool = (UI.pool && UI.poolDay===day) ? UI.pool.filter(n=>candidates.includes(n)) : defaultPool;
  const share = modo==="comun" && pool.length ? propinas/pool.length : 0;
  const allNames=[...new Set([...names, ...(modo==="comun"?pool:[])])];
  const rows=allNames.map(n=>{ const r=map[n]||{name:n,ventas:0,pedidos:0,propias:0}; return Object.assign({}, r, {entregar: modo==="comun" ? (pool.includes(n)?share:0) : (n==="Sin asignar"?0:r.propias)}); });
  const sinAsignarTips = modo==="individual" && map["Sin asignar"] ? map["Sin asignar"].propias : 0;
  const modoTxt = modo==="comun" ? "fondo común" : "cada quien las suyas";
  const html=`<div class="card"><div class="spread"><h3 style="font-size:19px">Por mesero</h3><span class="pill">Propinas: ${modoTxt}</span></div>
    <div class="table-wrap"><table><tr><th>Mesero</th><th>Pedidos</th><th style="text-align:right">Ventas</th><th style="text-align:right">Propina a entregar</th></tr>
    ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.pedidos}</td><td style="text-align:right">${money(r.ventas)}</td><td style="text-align:right;font-weight:700">${money(r.entregar)}</td></tr>`).join("")}</table></div>
    ${modo==="comun"?`<p class="muted" style="font-size:13.5px;margin:10px 0 4px">El fondo de ${money(propinas)} se reparte en partes iguales entre quienes marques:</p>
      ${candidates.map(n=>`<label class="chk"><input type="checkbox" data-pool="${esc(n)}" ${pool.includes(n)?"checked":""}> ${esc(n)}</label>`).join("")}`:""}
    ${sinAsignarTips?`<p class="muted" style="font-size:13.5px">Hay ${money(sinAsignarTips)} de propina en pedidos sin mesero. Asígnalos desde el pedido (⋯).</p>`:""}
  </div>`;
  return {html, rows, defaultPool, modoTxt};
}

const lbl=(arr,k)=>(arr.find(x=>x[0]===k)||[k,k])[1];

function parseCoords(t){
  if(!t) return null; let s=String(t); try{ s=decodeURIComponent(s); }catch(e){}
  const pats=[/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/, /[?&](?:q|ll|query|daddr|destination|sll|center|coordinate|saddr)=(?:loc:)?(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/, /@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/, /(?:^|[\s\/(=])(-?\d{1,2}\.\d{4,})\s*,\s*(-?\d{1,3}\.\d{4,})/];
  for(const p of pats){ const m=s.match(p); if(m){ const lat=+m[1], lng=+m[2]; if(Math.abs(lat)<=90 && Math.abs(lng)<=180 && !(lat===0&&lng===0)) return {lat,lng}; } }
  return null;
}
function haversine(a,b){ const R=6371, r=x=>x*Math.PI/180; const dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function calcEnvio(km){ const e=cfg().envio||{}; const lim=Number(e.gratisHastaKm)||0; if(km==null || km<=lim) return 0;
  return (Number(e.cargoFijo)||0) + Math.ceil(km-lim)*(Number(e.cargoPorKm)||0); }

async function rutaA(dest){
  const loc=cfg().local; if(!loc) return null;
  try { const r=await rutasFn({accion:"ruta", desde:loc, hasta:dest}); return {km:r.km, min:r.min, aprox:false}; }
  catch(e){ const km=haversine(loc,dest)*1.35; return {km, min:Math.round(km/25*60)+3, aprox:true}; }
}
async function ubicar(texto){
  const t=texto.trim(); let c=parseCoords(t); if(c) return {coords:c};
  if(/^https?:\/\//i.test(t)){
    try { const r=await rutasFn({accion:"expandir", url:t}); c=parseCoords(r.url||"")||parseCoords(r.html||""); if(c) return {coords:c}; } catch(e){}
    throw new Error("No pude leer ese enlace. Marca el punto en el mapa o pide al cliente su ubicación actual.");
  }
  let r; try { r=await rutasFn({accion:"buscar", texto:t, cerca:cfg().local}); }
  catch(e){ throw new Error("Buscar direcciones requiere la función de rutas activa. Pega un enlace o marca el punto en el mapa."); }
  if(r.resultados && r.resultados.length) return {coords:{lat:r.resultados[0].lat,lng:r.resultados[0].lng}, label:r.resultados[0].label};

}

  const last=(()=>{ try { return localStorage.getItem("buba-limpieza-fecha")||""; } catch(e){ return ""; } })();
  let res="";
  if(pv){
    if(pv.error) res=`<p class="muted">${esc(pv.error)}</p>`;
    else if(!pv.cliente && !pv.pedidos) res=`<p class="muted">No hay datos guardados con el teléfono ${esc(pv.tel)}.</p>`;
    else { const cl=pv.cliente||{}; const pr=cl.promos&&typeof cl.promos.acepta==="boolean"?(cl.promos.acepta?"Sí acepta":"No acepta"):"No se preguntó";
      res=`<div class="ptext"><strong>${esc(cl.nombre||"Sin nombre")}</strong> · ${esc(pv.tel)}
Dirección: ${esc(cl.ubicacion||"—")}
Referencias: ${esc(cl.referencias||"—")}
Ubicación en mapa: ${cl.lat!=null?"guardada":"no"}
Promociones: ${pr}
Pedidos con este teléfono: ${pv.pedidos}
Último pedido: ${cl.ultimo?new Date(cl.ultimo).toLocaleDateString("es-MX"):"—"}</div>
      <div class="row">
        <a class="btn sm ghost" href="${waLink(pv.tel, `Hola ${cl.nombre||""}, estos son los datos que ${cfg().negocio} tiene guardados de ti:\n${privResumen(pv)}\n\nSi quieres corregir o borrar algo, responde a este mensaje. Aviso de privacidad: ${avisoUrl()}`)}" target="_blank" rel="noopener">Enviarle sus datos</a>
        ${pv.cliente?`<button class="btn sm ghost" id="pvEdit">Corregir</button><button class="btn sm ghost" id="pvPromoTgl">${cl.promos&&cl.promos.acepta?"Quitar promociones":"Marcar que acepta promociones"}</button>`:""}
        <button class="btn sm pink" id="pvDel">Borrar todos sus datos</button>
      </div>`; }
  }
  return `<div class="card" id="privCard"><h3 style="font-size:19px">Privacidad de clientes</h3>
    <p class="muted" style="margin-top:4px">Responsable: ${esc(PRIV.responsable)} · Aviso vigente desde el ${esc(PRIV.vigencia)}.</p>
    <div class="row"><a class="btn sm ghost" href="aviso-privacidad.html" target="_blank" rel="noopener">Ver aviso completo</a><button class="btn sm ghost" id="pvCopy">Copiar aviso corto</button><button class="btn sm ghost" id="pvGuion">Copiar guion para llamadas</button><button class="btn sm ghost" id="pvLetrero">Imprimir letrero de cámara</button></div>
    <h3 style="font-size:17px;margin-top:16px">Solicitudes de clientes (ver, corregir o borrar)</h3>
    <div class="row" style="flex-wrap:nowrap"><input id="pvTel" type="tel" inputmode="tel" placeholder="Teléfono a 10 dígitos" value="${esc(pv&&pv.tel||"")}"><button class="btn primary" id="pvFind">Buscar</button></div>
    <div style="margin-top:8px">${res}</div>
    <h3 style="font-size:17px;margin-top:16px">Borrado automático</h3>
    <p class="muted" style="margin:4px 0 8px">Se borran los clientes sin pedidos en este tiempo, y en pedidos más antiguos se quitan nombre, teléfono y dirección. Se revisa una vez al día.${last?` Última revisión en este celular: ${esc(last)}.`:""}</p>
    <div class="seg">${[6,12,24].map(n=>`<button data-cons="${n}" aria-pressed="${meses===n}">${n} meses</button>`).join("")}</div>
    <p class="muted" style="font-size:13px">El aviso publicado dice 12 meses. Si cambias el plazo, avísame para actualizar el aviso.</p>
    <button class="btn ghost sm" id="pvClean">Revisar ahora</button>
    <h3 style="font-size:17px;margin-top:16px">Promociones por WhatsApp</h3>
    <p class="muted" style="margin:4px 0 8px">${UI.pvPromos?`${UI.pvPromos.length} cliente(s) aceptan recibir promociones.`:"Consultando…"}</p>
    ${UI.pvPromos&&UI.pvPromos.length?`<button class="btn ghost sm" id="pvPromoCopy">Copiar teléfonos que aceptan</button>`:""}
  </div>`;
}
function privResumen(pv){ const cl=pv.cliente||{}; return `Nombre: ${cl.nombre||"—"}\nTeléfono: ${pv.tel}\nDirección: ${cl.ubicacion||"—"}\nReferencias: ${cl.referencias||"—"}\nPromociones: ${cl.promos&&typeof cl.promos.acepta==="boolean"?(cl.promos.acepta?"sí":"no"):"sin respuesta"}\nPedidos registrados: ${pv.pedidos}`; }
async function privBuscar(tel){
  UI.pv={tel}; 
  try {
    const [c,p]=await Promise.all([ sb.from("clientes").select("data").eq("id",tel).maybeSingle(),
      sb.from("pedidos").select("id",{count:"exact",head:true}).eq("data->entrega->>telefono",tel) ]);
    if(c.error) throw c.error;
    UI.pv={tel, cliente:c.data?c.data.data:null, pedidos:p.count||0};
    if(UI.pv.cliente) Store.data.clientes[tel]=UI.pv.cliente;
  } catch(e){ UI.pv={tel, error:"No se pudo consultar. Revisa que ejecutaste las migraciones 1.2 y 1.3 en Supabase."}; }
  render();
}
async function privPromos(){
  UI.pvPromosAt=Date.now();
  try { const {data,error}=await sb.from("clientes").select("id,data").eq("data->promos->>acepta","true"); if(error) throw error; UI.pvPromos=data.map(r=>({tel:r.id, nombre:r.data.nombre||""})); }
  catch(e){ UI.pvPromos=[]; }
  if(UI.tab==="ajustes") render();
}
async function limpiarDatos(silencioso){
  const meses=Number(cfg().conservacionMeses)||12;
  try {
    const {data,error}=await sb.rpc("limpiar_datos_personales",{meses});
    if(error) throw error;
    try { localStorage.setItem("buba-limpieza", today()); localStorage.setItem("buba-limpieza-fecha", new Date().toLocaleString("es-MX")); } catch(e){}
    const n=(data&&data.clientes||0)+(data&&data.pedidos||0);
    if(!silencioso || n) toast(n?`Privacidad: se borraron ${data.clientes} cliente(s) y se anonimizaron ${data.pedidos} pedido(s) antiguos`:"Todo en orden: no hay datos vencidos");
    if(!silencioso && UI.tab==="ajustes") render();
  } catch(e){ if(!silencioso) toast("No se pudo revisar. ¿Ejecutaste migracion-1.3.sql?"); }
}
function limpiezaDiaria(){ let last=""; try { last=localStorage.getItem("buba-limpieza")||""; } catch(e){} if(last!==today()) limpiarDatos(true); }
function bindPrivacidad(){
  if(!$("#privCard")) return;
  if(!UI.pvPromosAt || Date.now()-UI.pvPromosAt>60000) privPromos();
  $("#pvCopy").onclick=async()=>toast(await copyText(avisoCorto())?"Aviso corto copiado":"No se pudo copiar");
  $("#pvGuion").onclick=async()=>toast(await copyText(guionLlamada().replace(/[“”]/g,""))?"Guion copiado":"No se pudo copiar");
  $("#pvLetrero").onclick=()=>{
    const box=document.createElement("div"); if(typeof QRCode!=="undefined") new QRCode(box,{text:avisoUrl(),width:260,height:260,colorDark:"#000000",colorLight:"#ffffff"});
    setTimeout(()=>{ const q=box.querySelector("canvas"); const src=q?q.toDataURL():"";
      $("#print").innerHTML=`<div style="font-family:Fredoka,'DM Sans',sans-serif;color:#000;text-align:center;padding:10mm;border:3px solid #000;border-radius:8mm;max-width:180mm;margin:0 auto">
        <div style="font-size:40px;font-weight:700;letter-spacing:1px">ZONA VIDEOVIGILADA</div>
        <div style="font-size:64px;line-height:1;margin:4mm 0">📹</div>
        <div style="font-family:'DM Sans',sans-serif;font-size:17px;line-height:1.45;margin:0 auto 5mm;max-width:150mm">${esc(cfg().negocio)}, cuyo responsable es ${esc(PRIV.responsable)}, capta imágenes en este lugar únicamente para la seguridad de clientes, personal e instalaciones. Las imágenes no se publican ni se comparten, salvo requerimiento de autoridad.</div>
        ${src?`<img src="${src}" style="width:55mm;height:55mm">`:""}
        <div style="font-family:'DM Sans',sans-serif;font-size:14px;margin-top:3mm">Consulta el aviso de privacidad completo escaneando el código<br>o en ${esc(avisoUrl())}<br>Dudas: WhatsApp ${esc(PRIV.whatsappTxt)}</div></div>`;
      setTimeout(()=>window.print(),80); },120); };
  $("#pvFind").onclick=()=>{ const t=onlyDigits($("#pvTel").value).slice(-10); if(t.length!==10){ toast("Escribe el teléfono a 10 dígitos"); return; } delete $("#pvTel").dataset.dirty; privBuscar(t); };
  $("#pvTel").onkeydown=e=>{ if(e.key==="Enter") $("#pvFind").click(); };
  const ed=$("#pvEdit"); if(ed) ed.onclick=()=>{ const pv=UI.pv, cl=Object.assign({},pv.cliente);
    modal(`<h3>Corregir datos</h3><div class="field"><label for="ce1">Nombre</label><input id="ce1" value="${esc(cl.nombre||"")}"></div>
      <div class="field"><label for="ce2">Dirección</label><input id="ce2" value="${esc(cl.ubicacion||"")}"></div>
      <div class="field"><label for="ce3">Referencias</label><input id="ce3" value="${esc(cl.referencias||"")}"></div>
      <button class="btn primary block" id="ceS">Guardar corrección</button>`, m=>{
      $("#ceS",m).onclick=()=>{ Object.assign(cl,{nombre:$("#ce1",m).value.trim(), ubicacion:$("#ce2",m).value.trim(), referencias:$("#ce3",m).value.trim(), corregido:Date.now()});
        Store.save("clientes", pv.tel, cl); UI.pv=Object.assign({},pv,{cliente:cl}); closeModal(); toast("Datos corregidos"); render(); }; }); };
  const pt=$("#pvPromoTgl"); if(pt) pt.onclick=()=>{ const pv=UI.pv; const cl=Object.assign({},pv.cliente); const acepta=!(cl.promos&&cl.promos.acepta);
    cl.promos={acepta, fecha:Date.now(), medio:"solicitud"}; Store.save("clientes", pv.tel, cl); UI.pv=Object.assign({},pv,{cliente:cl}); UI.pvPromosAt=0; toast(acepta?"Marcado: acepta promociones":"Promociones desactivadas"); render(); };
  const dl=$("#pvDel"); if(dl) dl.onclick=async()=>{ const tel=UI.pv.tel;
    if(!confirm(`Se borrarán los datos del cliente ${tel} y se quitarán su nombre, teléfono y dirección de todos sus pedidos. Esto no se puede deshacer. ¿Continuar?`)) return;
    try { const {data,error}=await sb.rpc("borrar_cliente",{tel}); if(error) throw error;
      delete Store.data.clientes[tel]; UI.pv={tel, cliente:null, pedidos:0}; UI.pvPromosAt=0;
      toast(`Listo: datos borrados (${data&&data.pedidos||0} pedido(s) anonimizados)`); await Store.load().catch(()=>{}); render();
      if(confirm("¿Avisar al cliente por WhatsApp que sus datos fueron borrados?")) window.open(waLink(tel,`Hola, te confirmamos que ${cfg().negocio} borró tus datos personales (nombre, teléfono y dirección) de sus registros, como lo solicitaste. Gracias.`),"_blank");
    } catch(e){ toast("No se pudo borrar. ¿Ejecutaste migracion-1.3.sql?"); } };
  document.querySelectorAll("[data-cons]").forEach(b=>b.onclick=()=>{ Store.save("config","main",Object.assign(cfg(),{conservacionMeses:+b.dataset.cons})); toast("Plazo guardado"); });
  $("#pvClean").onclick=()=>limpiarDatos(false);
  const pc=$("#pvPromoCopy"); if(pc) pc.onclick=async()=>toast(await copyText(UI.pvPromos.map(x=>`${x.tel}${x.nombre?" · "+x.nombre:""}`).join("\n"))?"Teléfonos copiados":"No se pudo copiar");
}

/* ---------- Mejoras ---------- */
const TIPOS=["Error","Mejora","Idea"], PRIOS=["Alta","Media","Baja"];
function mejoras(){ return Object.entries(Store.data.mejoras||{}).map(([id,m])=>Object.assign({id},m)).sort((a,b)=>(a.estado==="hecha")-(b.estado==="hecha") || PRIOS.indexOf(a.prioridad)-PRIOS.indexOf(b.prioridad) || a.creado-b.creado); }
function mejorasCard(){
  if (!Store.mejorasOk) return `<div class="card"><h3 style="font-size:19px">Mejoras para la app</h3><p class="muted">Falta ejecutar <strong>supabase/migracion-1.1.sql</strong> en Supabase para activar esta sección.</p></div>`;
  const list=mejoras(); const pend=list.filter(m=>m.estado==="pendiente");
  return `<div class="card" id="mejoras"><div class="spread"><h3 style="font-size:19px">Mejoras para la app</h3><span class="muted" style="font-size:14px">${pend.length} pendiente(s)</span></div>
    <p class="muted" style="margin-top:4px">Anota errores o ideas cuando surjan. Luego copia la lista y pégala en tu chat con Claude.</p>
    <div class="field"><label for="mt">¿Qué hay que mejorar o corregir?</label><textarea id="mt" rows="2" placeholder="Ej. Al cobrar en efectivo quiero botones de billetes de 100, 200 y 500"></textarea></div>
    <div class="row" style="margin-bottom:10px"><div class="seg" id="mtipo">${TIPOS.map((t,i)=>`<button data-tipo="${t}" aria-pressed="${i===1}">${t}</button>`).join("")}</div></div>
    <div class="row" style="margin-bottom:12px"><div class="seg" id="mprio">${PRIOS.map((t,i)=>`<button data-prio="${t}" aria-pressed="${i===1}">${t}</button>`).join("")}</div></div>
    <button class="btn primary block" id="madd">Agregar a la lista</button>
    <div style="margin-top:12px">${list.length?list.map(m=>`<div class="imp"><div><div class="t">${m.estado==="hecha"?`<s>${esc(m.texto)}</s>`:esc(m.texto)}</div>
        <div class="m"><span class="tag ${m.prioridad}">${m.prioridad}</span><span class="tag ${m.estado==="hecha"?"hecha":""}">${m.tipo}${m.estado==="enviada"?" · enviada":m.estado==="hecha"?" · hecha":""}</span>${esc(m.autor||"")} · ${new Date(m.creado).toLocaleDateString("es-MX")}</div></div>
        <button class="btn sm ghost" data-mej="${m.id}">⋯</button></div>`).join(""):`<p class="muted">Aún no hay mejoras anotadas.</p>`}</div>
    ${pend.length?`<div class="row" style="margin-top:12px"><button class="btn mango" id="mcopy" style="flex:1">Copiar lista para Claude</button>${navigator.share?`<button class="btn ghost" id="mshare">Compartir</button>`:""}</div>`:""}
  </div>`;
}
function mejorasText(){
  const pend=mejoras().filter(m=>m.estado==="pendiente");
  let t=`BubaManía — lista de mejoras\nVersión actual: ${APP_VERSION} · ${new Date().toLocaleDateString("es-MX")}\nContexto: app web en GitHub Pages + Supabase (index.html, menu.html, supabase/schema.sql).\n`;
  TIPOS.forEach(tipo=>{ const g=pend.filter(m=>m.tipo===tipo); if(!g.length) return; t+=`\n${tipo==="Error"?"Errores":tipo==="Mejora"?"Mejoras":"Ideas"}:\n`; g.forEach((m,i)=>{ t+=`${i+1}. [${m.prioridad}] ${m.texto}${m.autor?` (lo pidió ${m.autor})`:""}\n`; }); });
  return t+`\nAntes de construir, dime todos los requisitos o dudas. Entrega los archivos actualizados con el número de versión nuevo y la lista de cambios.`;
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch(e){}
  const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){} ta.remove(); return ok;
}
function bindMejoras(){
  if (!$("#madd")) return;
  let tipo="Mejora", prio="Media";
  document.querySelectorAll("[data-tipo]").forEach(b=>b.onclick=()=>{ tipo=b.dataset.tipo; document.querySelectorAll("[data-tipo]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  document.querySelectorAll("[data-prio]").forEach(b=>b.onclick=()=>{ prio=b.dataset.prio; document.querySelectorAll("[data-prio]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  $("#madd").onclick=()=>{ const texto=$("#mt").value.trim(); if(!texto){ toast("Escribe la mejora"); return; }
    Store.save("mejoras", uid(), {texto, tipo, prioridad:prio, estado:"pendiente", autor:Store.userName||Store.userEmail, creado:Date.now(), version:APP_VERSION}); const t=$("#mt"); t.value=""; delete t.dataset.dirty; toast("Mejora agregada"); };
  document.querySelectorAll("[data-mej]").forEach(b=>b.onclick=()=>{ const id=b.dataset.mej; const m=Store.data.mejoras[id];
    modal(`<h3>Mejora</h3><div class="field"><label for="me">Descripción</label><textarea id="me" rows="3">${esc(m.texto)}</textarea></div>
      <div class="field"><label>Estado</label><div class="seg" id="mest">${[["pendiente","Pendiente"],["enviada","Enviada a Claude"],["hecha","Hecha"]].map(([k,l])=>`<button data-est="${k}" aria-pressed="${m.estado===k}">${l}</button>`).join("")}</div></div>
      <button class="btn primary block" id="msv">Guardar</button><button class="btn ghost block" id="mdel" style="margin-top:8px;color:var(--pink)">Eliminar</button>`, md=>{
      let est=m.estado;
      md.querySelectorAll("[data-est]").forEach(x=>x.onclick=()=>{ est=x.dataset.est; md.querySelectorAll("[data-est]").forEach(y=>y.setAttribute("aria-pressed",y===x)); });
      $("#msv",md).onclick=()=>{ Store.save("mejoras",id,Object.assign({},m,{texto:$("#me",md).value.trim()||m.texto, estado:est})); closeModal(); };
      $("#mdel",md).onclick=()=>{ if(confirm("¿Eliminar esta mejora?")){ Store.remove("mejoras",id); closeModal(); } };
    }); });
  const afterSend=()=>{ if(confirm("Lista copiada. ¿Marcar estas mejoras como “enviadas a Claude”?")) mejoras().filter(m=>m.estado==="pendiente").forEach(m=>{ const {id,...d}=m; Store.save("mejoras",id,Object.assign(d,{estado:"enviada"})); }); };
  const cp=$("#mcopy"); if(cp) cp.onclick=async()=>{ if(await copyText(mejorasText())) afterSend(); else toast("No se pudo copiar. Usa Compartir."); };
  const sh=$("#mshare"); if(sh) sh.onclick=async()=>{ try{ await navigator.share({text:mejorasText()}); afterSend(); }catch(e){} };
}

/* ---------- Ajustes ---------- */

  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ papel=b.dataset.w; document.querySelectorAll("[data-w]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  $("#as").onclick=()=>{ Store.save("config","main",Object.assign(cfg(),{negocio:$("#an").value.trim()||"BubaManía",direccion:$("#ad").value.trim(),pie:$("#ap").value.trim(),papel,qrUrl:$("#aq").value.trim()})); toast("Ajustes guardados"); };
  $("#atest").onclick=()=>printTicket({num:0,nombre:"Prueba",comensales:[{id:"x",nombre:"Cliente",items:[{id:"1",cant:2,nombre:"Frappé taro",precio:65},{id:"2",cant:1,nombre:"Boneless 250 g",precio:120,nota:"BBQ"}]}]},null);
  const drawQR=url=>{ const box=$("#qrbox"); box.innerHTML=""; if(!url) return; if(typeof QRCode==="undefined"){ box.textContent="No se pudo cargar el generador de QR."; return; } new QRCode(box,{text:url,width:220,height:220,colorDark:"#2B1745",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M}); $("#qrWrap").classList.remove("hidden"); };
  $("#genqr").onclick=()=>{ const u=$("#aq").value.trim(); if(!/^https?:\/\//i.test(u)){ toast("Pega un enlace que empiece con https://"); return; } Store.save("config","main",Object.assign(cfg(),{qrUrl:u})); drawQR(u); };
  $("#prqr").onclick=()=>{ const img=$("#qrbox img")||$("#qrbox canvas"); if(!img){ toast("Primero genera el QR"); return; } const s=img.tagName==="CANVAS"?img.toDataURL():img.src;
    $("#print").innerHTML=`<div style="text-align:center;font-family:Fredoka,sans-serif;color:#2B1745;padding:20px"><div style="font-size:40px;font-weight:700">${esc(cfg().negocio)}</div><div style="font-size:20px;margin:6px 0 16px">Escanea y mira nuestro menú</div><img src="${s}" style="width:70mm;height:70mm"></div>`; setTimeout(()=>window.print(),60); };
  setTimeout(()=>drawQR(c.qrUrl||publicMenuUrl()),0);
  $("#logout").onclick=async()=>{ if(!confirm("¿Cerrar sesión en este dispositivo?")) return; await sb.auth.signOut(); location.reload(); };
  $("#purge").onclick=()=>{ const lim=Date.now()-30*864e5; const old=orders().filter(o=>o.creado<lim && (o.estado==="pagado"||o.estado==="cancelado")); if(!old.length){ toast("No hay pedidos antiguos"); return; } if(!confirm(`Se borrarán ${old.length} pedidos antiguos. ¿Continuar?`)) return; old.forEach(o=>Store.remove("pedidos",o.id)); toast("Pedidos antiguos borrados"); };
}

/* ---------- Modales ---------- */
function modal(html, onMount){
  const host=$("#modalHost"); host.innerHTML=`<div class="modal-wrap"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const wrap=host.firstElementChild; wrap.addEventListener("click",e=>{ if(e.target===wrap) closeModal(); });
  if(onMount) onMount(wrap.firstElementChild);
}
function closeModal(){ $("#modalHost").innerHTML=""; }
function promptText(title, ph, val, cb, allowEmpty){
  modal(`<h3>${esc(title)}</h3><div class="field"><input id="pt" placeholder="${esc(ph)}" value="${esc(val||"")}"></div><button class="btn primary block" id="pok">Guardar</button>`, m=>{
    const i=$("#pt",m); i.focus(); i.select();
    const go=()=>{ const v=i.value.trim(); if(!v && !allowEmpty) return; cb(v); closeModal(); };
    $("#pok",m).onclick=go; i.onkeydown=e=>{ if(e.key==="Enter") go(); };
  });
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if($("#modalHost").innerHTML) closeModal(); else if(UI.openOrder) closeOrder(); } });

/* ---------- Inicio ---------- */
function publicMenuUrl(){ return new URL("menu.html", location.href).href; }

async function start(session){
  const { data:ok, error } = await sb.rpc("is_staff");
  if (error || !ok){
    $("#lmsg").textContent = error ? "No se pudo verificar tu usuario. Revisa la conexión." : "Este usuario no está dado de alta como personal (tabla staff).";
    await sb.auth.signOut(); return;
  }
  Store.userEmail = session.user.email || "";
  try { const { data:st } = await sb.from("staff").select("nombre").eq("user_id", session.user.id).maybeSingle(); Store.userName = (st && st.nombre) || ""; } catch(e){}
  document.body.classList.remove("locked");
  Store.on(render); render();
  Store.init().then(()=>limpiezaDiaria());
}
async function boot(){
  $("#lver").textContent = "Versión " + APP_VERSION;
  if (!sb){ document.body.classList.add("locked"); $("#lmsg").textContent="Falta configurar config.js con la URL y la clave pública de Supabase."; $("#lb").disabled=true; return; }
  const { data:{ session } } = await sb.auth.getSession();
  if (session) return start(session);
  const doLogin = async()=>{
    const email=$("#lu").value.trim(), password=$("#lp").value;
    if(!email||!password){ $("#lmsg").textContent="Escribe correo y contraseña."; return; }
    $("#lb").disabled=true; $("#lmsg").textContent="Entrando…";
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    $("#lb").disabled=false;
    if (error){ $("#lmsg").textContent="Correo o contraseña incorrectos."; return; }
    $("#lmsg").textContent=""; start(data.session);
  };
  $("#lb").onclick=doLogin; $("#lp").onkeydown=e=>{ if(e.key==="Enter") doLogin(); };
}
boot();
</script>
